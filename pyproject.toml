[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77", "setuptools_scm>=8"]

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pandas-stubs>=3.0.5.260914",
  "pre-commit>=4.6.2",
  "pytest>=9.1.1"
]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering"
]
dependencies = ["cfgrib", "ecmwf-datastores-client", "ecmwf-opendata", "polytope-client", "xarray"]
description = "Xarray backend to access ECMWF datastores"
dynamic = ["version"]
license = "Apache-2.0"
license-files = ["LICENSE"]
name = "xarray-ecmwf"
readme = "README.md"
requires-python = ">=3.11"

[project.entry-points."xarray.backends"]
ecmwf = "xarray_ecmwf.engine_ecmwf:ECMWFBackendEntrypoint"

[tool.coverage.run]
branch = true

[tool.mypy]
plugins = "numpy.typing.mypy_plugin"
strict = true

[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
  "cf2cdm",
  "ecmwf",
  "ecmwf.opendata",
  "polytope",
  "polytope.api"
]

[tool.ruff]
ignore = [
  # pydocstyle: Missing Docstrings
  "D1"
]
# Same as Black.
indent-width = 4
line-length = 88
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pydocstyle
  "D"
]

[tool.ruff.lint.pycodestyle]
max-line-length = 110

[tool.ruff.pydocstyle]
convention = "numpy"

[tool.setuptools]
packages = ["xarray_ecmwf"]

[tool.setuptools_scm]
write_to = "xarray_ecmwf/version.py"
write_to_template = '''
# Do not change! Do not track in version control!
__version__ = "{version}"
'''
